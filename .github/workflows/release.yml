name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build bundles (dist/host.js + dist/client.js)
        run: npm run build

      - name: Run smoke tests
        run: npm test

      - name: Verify entry artifacts exist
        run: |
          test -f dist/host.js || { echo "ERROR: dist/host.js missing after build"; exit 1; }
          test -f dist/client.js || { echo "ERROR: dist/client.js missing after build"; exit 1; }
          ls -la dist

      - name: Pack and verify tarball contains dist/
        run: |
          npm pack
          TARBALL=$(ls dsh-model-ultra-*.tgz)
          echo "Tarball: $TARBALL"
          tar tzf "$TARBALL" | grep -q 'package/dist/host.js' || { echo "ERROR: dist/host.js not in tarball"; exit 1; }
          tar tzf "$TARBALL" | grep -q 'package/dist/client.js' || { echo "ERROR: dist/client.js not in tarball"; exit 1; }

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
